<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f6f3">
    <title>Daybook | A little more focused</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="Daybook home"><span class="wordmark-mark">d.</span> daybook</a>
        <span class="topbar-note">A little more focused</span>
      </header>

      <section class="workspace" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow" id="today-label">YOUR DAY, AT A GLANCE</p>
          <h1 id="page-title">Make room for<br><span>what matters.</span></h1>
          <p class="intro-copy">One thing at a time is a good place to start.</p>
        </div>

        <section class="list-panel" aria-label="Your tasks">
          <form class="task-form" id="task-form">
            <label class="visually-hidden" for="task-input">Add a task</label>
            <input id="task-input" name="text" maxlength="200" placeholder="What would you like to get done?" autocomplete="off" required>
            <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
          </form>

          <div class="list-toolbar">
            <div class="list-heading">
              <h2>Today</h2>
              <span class="task-count" id="task-count">0</span>
            </div>
            <div class="filters" role="tablist" aria-label="Filter tasks">
              <button class="filter-button is-active" type="button" role="tab" aria-selected="true" data-filter="all">All</button>
              <button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="open">To do</button>
              <button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="done">Done</button>
            </div>
          </div>

          <ul class="task-list" id="task-list" aria-live="polite"></ul>
          <p class="empty-state" id="empty-state">A clear page. Add one small thing to begin.</p>
          <p class="status-message" id="status-message" role="status"></p>
          <footer class="list-footer"><span class="footer-spark" aria-hidden="true">✳</span> Progress, not perfection.</footer>
        </section>
      </section>
      <footer class="page-footer">A quieter way to keep moving.</footer>
    </main>
  </body>
</html>
